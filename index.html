
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente Psicotécnico Angola</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 { color: #60a5fa; }
    p { color: #d1d5db; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 16px;
      min-height: 110px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #1e293b;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Assistente Psicotécnico Angola</h1>
  <p>Escreve o exercício e recebe uma explicação do raciocínio.</p>

  <label for="pergunta">Pergunta ou exercício:</label>
  <textarea id="pergunta" placeholder="Ex.: 2, 4, 8, 16, ... Qual é o próximo número?"></textarea>

  <label for="alternativas">Alternativas (opcional):</label>
  <textarea id="alternativas" placeholder="A) 20&#10;B) 24&#10;C) 32&#10;D) 36"></textarea>

  <button id="botao" onclick="analisar()">Analisar exercício</button>
  <div id="resultado">A resposta da IA aparecerá aqui.</div>

  <script>
    async function analisar() {
      const pergunta = document.getElementById("pergunta").value.trim();
      const alternativas = document.getElementById("alternativas").value.trim();
      const resultado = document.getElementById("resultado");
      const botao = document.getElementById("botao");

      if (!pergunta) {
        resultado.textContent = "Escreve primeiro uma pergunta.";
        return;
      }

      botao.disabled = true;
      botao.textContent = "A analisar...";
      resultado.textContent = "A consultar a inteligência artificial. Aguarda...";

      try {
        const resposta = await fetch(
          "https://assistente-psicotecnico-api.onrender.com/analisar",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pergunta: pergunta,
              alternativas: alternativas
            })
          }
        );

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.detail || "Ocorreu um erro.");
        }

        resultado.textContent = dados.resposta || "A IA não devolveu uma resposta.";
      } catch (erro) {
        resultado.textContent =
          "Não foi possível obter a resposta. Verifica a ligação à internet e tenta novamente. Detalhe: " +
          erro.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Analisar exercício";
      }
    }
  </script>
</body>
</html>
